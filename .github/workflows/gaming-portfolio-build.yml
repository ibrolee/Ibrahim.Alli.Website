name: Gaming portfolio build check

on:
  push:
    branches: [feature/gaming-portfolio-2026-10-19]
  pull_request:
    branches: [migration/cloudflare-portfolio-2026-10-17]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build portfolio
        run: bun run build
      - name: Confirm gaming route is included
        run: |
          test -d .output/public
          grep -R -q "Every world" .output
          echo "Gaming portfolio build completed and route content was emitted."
