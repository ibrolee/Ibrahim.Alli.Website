name: Gaming portfolio preview deploy

on:
  push:
    branches: [feature/gaming-portfolio-2026-10-19]

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Build and deploy preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build portfolio
        run: bun run build
      - name: Deploy preview Worker (not production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.135.0 deploy
