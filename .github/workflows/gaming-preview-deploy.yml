name: Gaming portfolio preview deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Build and deploy preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build portfolio
        run: bun run build
      - name: Deploy preview Worker (not production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Preview build succeeded, but deployment was skipped because CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are not configured."
            exit 0
          fi
          npx --yes wrangler@4.135.0 deploy
