name: Scent Cabinet branch check
on:
  push:
    branches: [feature/scent-cabinet-web]
  pull_request:
    paths:
      - 'src/routes/fragrance.tsx'
      - 'src/lib/scent-photos.ts'
      - 'src/lib/scent-providers.ts'
      - 'src/fragrance.css'
      - 'src/server.ts'
      - 'src/routes/__root.tsx'
      - 'public/fragrance*'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Check new fragrance code types
        run: |
          bun x tsc --noEmit > type-errors.txt 2>&1 || true
          if grep -E "src/(routes/fragrance.tsx|lib/scent-photos.ts|lib/scent-providers.ts)\\([0-9]+,[0-9]+\\): error TS" type-errors.txt; then
            exit 1
          fi
          echo "No fragrance page type errors. Existing site type errors are outside this feature."
