name: Scent Cabinet branch check
on:
  push:
    branches: [feature/scent-cabinet-web]
  pull_request:
    paths:
      - 'src/routes/fragrance.tsx'
      - 'src/lib/scent-photos.ts'
      - 'src/lib/scent-providers.ts'
      - 'src/lib/scent-catalogue*'
      - 'src/lib/scent-shelf*'
      - 'src/lib/scent-search*'
      - 'src/lib/scent-sync*'
      - 'src/lib/scent-photo-cloud*'
      - 'src/lib/scent-identity.ts'
      - 'src/lib/scent-gateway.ts'
      - 'src/lib/scent-wikidata.ts'
      - 'src/fragrance.css'
      - 'src/server.ts'
      - 'wrangler.jsonc'
      - 'src/routes/__root.tsx'
      - 'public/fragrance*'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Check combined search, duplicate handling and provider outages
        run: bun test src/lib/scent-providers.test.ts src/lib/scent-filters.test.ts src/lib/scent-catalogue.test.ts src/lib/scent-shelf.test.ts src/lib/scent-search.test.ts src/lib/scent-discover-manual.test.ts src/lib/scent-cabinet-layout.test.ts src/lib/scent-sync.test.ts src/lib/scent-photo-cloud.test.ts
      - name: Check new fragrance code types
        run: |
          bun x tsc --noEmit > type-errors.txt 2>&1 || true
          if grep -E "src/(routes/fragrance.tsx|server.ts|lib/scent-(photos|providers|catalogue|identity|gateway|wikidata|filters|shelf|search|sync-server|sync-client|photo-cloud).ts)\\([0-9]+,[0-9]+\\): error TS" type-errors.txt; then
            exit 1
          fi
          echo "No fragrance page type errors. Existing site type errors are outside this feature."
