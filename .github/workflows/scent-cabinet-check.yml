name: Scent Cabinet branch check
on:
  push:
    branches: [feature/scent-cabinet-web]
  pull_request:
    paths:
      - 'src/routes/fragrance.tsx'
      - 'src/fragrance.css'
      - 'src/server.ts'
      - 'src/routes/__root.tsx'
      - 'public/fragrance*'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun run build
